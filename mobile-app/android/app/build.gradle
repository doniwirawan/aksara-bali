plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load release signing config from android/key.properties (kept out of git).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "xyz.doniwirawan.aksara_bali_mobile"
    // Pinned to 36 (Android 16) to meet Google Play's target API requirement
    // (deadline 31 Aug 2026). Flutter 3.27's default is still 35.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "xyz.doniwirawan.aksara_bali_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24 // flutter_tts requires API 24+
        targetSdk = 36 // Google Play target API requirement (Android 16)
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Use the release upload key when key.properties is present, else debug.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

// The GitHub APK updates itself in-app; the Play build must not (Play policy).
// A build counts as Play when it is an app bundle or passes
// --dart-define=PLAY_STORE=true. Everything else merges src/sideload into
// release, adding the network + install permissions and the FileProvider.
def dartDefines = project.hasProperty("dart-defines")
    ? project.property("dart-defines").toString().split(",").collect { new String(it.decodeBase64(), "UTF-8") }
    : []
def isPlayBuild = dartDefines.contains("PLAY_STORE=true") ||
    gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
if (!isPlayBuild) {
    android.sourceSets.release.manifest.srcFile "src/sideload/AndroidManifest.xml"
}

dependencies {
    implementation "androidx.core:core:1.13.1" // FileProvider for the updater
}

flutter {
    source = "../.."
}
